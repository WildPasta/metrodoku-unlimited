# Builds the Chrome Web Store package (ZIP with manifest.json at its root)
# and attaches it to a GitHub Release whenever a version tag (v*.*.*) is
# pushed. The tag must match the "version" field of manifest.json, and the
# manifest's file references (icons, content scripts) must all exist.
#
# Optionally, after publishing the release, the package is uploaded to the
# Chrome Web Store (upload + submit for review). This step is self-gating:
# it only runs when the CWS_CLIENT_ID secret is configured. Required secrets
# (repo Settings > Secrets and variables > Actions):
#   CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN  (OAuth, see
#     https://developer.chrome.com/docs/webstore/using-api)
#   CWS_EXTENSION_ID  (from the Developer Dashboard item page)
#   CWS_PUBLISHER_ID  (Dashboard > Publisher > Settings)
#
# Usage:
#   git tag v1.0.0
#   git push origin v1.0.0

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  # Lets the store-upload step self-gate: secrets are not readable in `if`,
  # but workflow-level env is. Empty until the CWS secrets are configured.
  CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}

jobs:
  store-package:
    name: Build store package and create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read manifest version
        id: manifest
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.manifest.outputs.version }}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version ${{ steps.manifest.outputs.version }}"
            exit 1
          fi

      - name: Syntax-check content.js
        run: node --check content.js

      - name: Validate manifest file references
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const files = [
              ...Object.values(manifest.icons || {}),
              ...(manifest.content_scripts || []).flatMap((cs) => cs.js || []),
            ];
            for (const file of files) {
              if (!fs.existsSync(file)) {
                throw new Error("manifest references missing file: " + file);
              }
            }
            console.log("manifest references OK:", files.join(", "));
          '

      - name: Build store ZIP (manifest at zip root)
        run: |
          mkdir -p dist
          ZIP="dist/metrodoku-unlimited-${{ steps.manifest.outputs.version }}.zip"
          zip -X "$ZIP" manifest.json content.js \
            icons/icon16.png icons/icon48.png icons/icon128.png
          unzip -l "$ZIP"

      - name: Create GitHub release with the package
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: "v${{ steps.manifest.outputs.version }}"
          generate_release_notes: true
          files: dist/*.zip

      # Uploads the same ZIP to the Chrome Web Store and submits it for
      # review (publish defaults to true). Skipped automatically until the
      # CWS_* secrets exist. Note: the API can only update an existing store
      # item — create it with one manual dashboard upload first. If the
      # previous version is still in review, this step fails: re-run the job
      # once the review completes.
      - name: Upload to Chrome Web Store
        if: ${{ env.CWS_CLIENT_ID != '' }}
        uses: mnao305/chrome-extension-upload@f549d5d654694a7722d6abfa64c97409ad5e64c1 # v7.0.0
        with:
          file-path: dist/metrodoku-unlimited-${{ steps.manifest.outputs.version }}.zip
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          publisher-id: ${{ secrets.CWS_PUBLISHER_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
